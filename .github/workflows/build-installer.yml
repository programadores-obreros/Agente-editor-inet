name: Instalador Windows (.exe)

# Compila el instalador .exe de Tecnia Bot en un runner Windows (Inno Setup).
# - Manual: pestaña Actions -> "Instalador Windows (.exe)" -> Run workflow.
# - Automático: al publicar un tag vX.Y.Z, adjunta el .exe al release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # para adjuntar el .exe al release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión de VERSION
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $v"

      # El .exe se rotula con VERSION, no con el tag. Si los dos no coinciden,
      # sale un instalador que dice una versión y un release que dice otra —y no
      # rompe nada, así que nadie lo nota hasta que alguien reporta un bug de una
      # versión que no existe. `tests/version.test.mjs` cuida los otros archivos;
      # el tag sólo se puede mirar acá, cuando existe.
      - name: El tag tiene que coincidir con VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $ver = "${{ steps.ver.outputs.version }}"
          if ($tag -ne $ver) {
            Write-Error "El tag dice $tag y VERSION dice $ver. Actualizá VERSION antes de taguear, o borrá el tag y volvé a crearlo."
            exit 1
          }
          Write-Host "Tag y VERSION coinciden: $ver"

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\tecnia-bot.iss"

      - name: Smoke test (instalación silenciosa, sin dependencias)
        shell: pwsh
        run: |
          $exe = "installer\dist\Instalar-Tecnia-Bot.exe"
          Write-Host "Instalando en silencio (con /skipdeps=1, saltea Scoop/OpenCode/PlatformIO)..."
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/skipdeps=1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador terminó con código $($p.ExitCode)" }
          $agent = "$env:LOCALAPPDATA\TecniaBot\opencode\agent\tecnia-bot.md"
          $lnk   = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Tecnia Bot.lnk"
          if (-not (Test-Path $agent)) { throw "Falta la capa instalada: $agent" }
          if (-not (Test-Path $lnk))   { throw "Falta el acceso directo del menú inicio: $lnk" }
          Write-Host "OK: la capa educativa y el acceso directo se instalaron correctamente."

      # El .exe copia install\ entero al lado del programa y bootstrap.ps1 lee de AHI
      # OPENCODE_VERSION (sin ese archivo se corta, a proposito). Las fichas viajan con
      # su manifiesto. Se verifica sobre la COPIA INSTALADA, no sobre el repo: lo que
      # se distribuye es esto, y con el parser de Windows PowerShell 5.1, que es el
      # que lo va a ejecutar en la escuela (ci.yml hace lo mismo sobre el repo).
      - name: La copia instalada parsea en PowerShell 5.1 y trae OPENCODE_VERSION + manifiesto
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host "::error::Este paso tiene que correr en Windows PowerShell 5.1"; exit 1 }
          $app = "$env:LOCALAPPDATA\TecniaBot"
          $total = 0
          foreach ($f in Get-ChildItem "$app\install\*.ps1") {
            $tokens = $null
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errores) | Out-Null
            if ($errores.Count -eq 0) { Write-Host "  OK   install\$($f.Name)"; continue }
            $total += $errores.Count
            foreach ($e in $errores) { Write-Host "::error file=install/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
          }
          if ($total -gt 0) { Write-Host "::error::$total error(es) de parseo en la copia instalada"; exit 1 }
          foreach ($rel in @("install\OPENCODE_VERSION", "opencode\skills\fichas\MANIFEST.sha256")) {
            if (-not (Test-Path "$app\$rel")) { Write-Host "::error::Falta en la instalacion: $app\$rel"; exit 1 }
            Write-Host "  OK   $rel"
          }
          $ver = (Get-Content "$app\install\OPENCODE_VERSION" -Raw).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { Write-Host "::error::install\OPENCODE_VERSION instalado dice '$ver'"; exit 1 }
          Write-Host "  OK   OpenCode fijado en $ver"

      # LA INSTALACION QUE HACE UN DOCENTE. El smoke test de arriba usa /skipdeps=1,
      # que saltea justo lo dificil (Scoop, OpenCode, Python, PlatformIO, Node y la
      # capa): con eso solo, un .exe que no instala nada daba verde. Aca se corre el
      # .exe entero y se mira el disco. Contrato del .exe (encabezado del .iss):
      # 0 = todo comprobado, 21 = instalado pero incompleto, 20 = el bootstrap fallo.
      - name: Instalacion real del .exe (con dependencias) y verificacion en disco
        shell: powershell
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "installer\dist\Instalar-Tecnia-Bot.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Write-Host "El instalador salio con $($p.ExitCode)"
          $app = "$env:LOCALAPPDATA\TecniaBot"
          if (Test-Path "$app\instalacion.log") { Get-Content "$app\instalacion.log" | Select-Object -Last 25 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::El .exe salio con $($p.ExitCode) (0 = bien, 21 = incompleto, 20 = fallo el bootstrap)"; exit 1 }
          if (Test-Path "$app\.instalando") { Write-Host "::error::quedo la marca .instalando despues de instalar"; exit 1 }
          $cfg = Join-Path $env:USERPROFILE ".config\opencode"
          if (-not (Test-Path "$cfg\agent\tecnia-bot.md")) { Write-Host "::error::la capa NO quedo publicada en $cfg"; exit 1 }
          $oc = [System.IO.File]::ReadAllText("$cfg\opencode.json", (New-Object System.Text.UTF8Encoding $false)) | ConvertFrom-Json
          if ($oc.default_agent -ne "tecnia-bot") { Write-Host "::error::default_agent es [$($oc.default_agent)]"; exit 1 }
          $oce = Join-Path $env:USERPROFILE "scoop\apps\opencode\current\opencode.exe"
          $v = (& $oce --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::opencode --version no contesta: $v"; exit 1 }
          Write-Host "  OK   capa publicada, agente por defecto, OpenCode $v"
          # El lanzador tiene que viajar en CRLF (lo fija .gitattributes): cmd.exe pierde
          # etiquetas con LF, y hasta la 0.4.8 la VM probaba un lanzador en LF mientras
          # el release lo publicaba en CRLF.
          $b = [System.IO.File]::ReadAllBytes("$app\abrir-tecnia-bot.cmd")
          $cr = @($b | Where-Object { $_ -eq 13 }).Count; $lf = @($b | Where-Object { $_ -eq 10 }).Count
          if ($lf -eq 0 -or $cr -ne $lf) { Write-Host "::error::el lanzador instalado no esta en CRLF (CR=$cr LF=$lf)"; exit 1 }
          Write-Host "  OK   el lanzador instalado esta en CRLF (CR=$cr LF=$lf)"

      # Y SE DESINSTALA COMO LO HACE WINDOWS. Ningun CI habia corrido nunca
      # unins000.exe. En silencio conserva los datos personales (no hay nadie para
      # contestar el cartel), asi que eso es lo que se mira.
      - name: Desinstalar con unins000.exe y verificar en disco
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$env:LOCALAPPDATA\TecniaBot"
          $cfg = Join-Path $env:USERPROFILE ".config\opencode"
          if (-not (Test-Path "$cfg\tecnia-perfil.md")) { Write-Host "::error::precondicion: no hay perfil antes de desinstalar"; exit 1 }
          $p = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Write-Host "El desinstalador salio con $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error::unins000.exe salio con $($p.ExitCode)"; exit 1 }
          # unins000.exe se copia a %TEMP% y sigue ahi un instante: se espera al proceso, no a un reloj.
          $tope = (Get-Date).AddSeconds(60)
          while ((Get-Process | Where-Object { $_.Name -like "_iu14D2N*" }) -and (Get-Date) -lt $tope) { Start-Sleep -Milliseconds 300 }
          if (Test-Path "$cfg\agent\tecnia-bot.md") { Write-Host "::error::el agente sigue publicado despues de desinstalar"; exit 1 }
          if (Test-Path "$cfg\tecnia-bot.manifest") { Write-Host "::error::el manifest sigue despues de desinstalar"; exit 1 }
          foreach ($resto in "install", "opencode", "abrir-tecnia-bot.cmd", "VERSION") { if (Test-Path "$app\$resto") { Write-Host "::error::quedo $resto en la carpeta del programa"; exit 1 } }
          if (-not (Test-Path "$cfg\tecnia-perfil.md")) { Write-Host "::error::la desinstalacion silenciosa borro el perfil (tenia que conservarlo)"; exit 1 }
          Write-Host "  OK   se fue lo del programa y el perfil se conservo"

      # Sin esto nadie puede verificar que el .exe que bajo es el que publicamos.
      # Importa mas de lo que parece: el instalador NO ESTA FIRMADO, asi que la
      # unica forma de comprobar que no lo tocaron en el camino es comparar el
      # hash contra el que publica el CI, que lo calcula sobre el binario que el
      # mismo acaba de compilar.
      - name: Calcular SHA256
        shell: pwsh
        run: |
          $exe = "installer\dist\Instalar-Tecnia-Bot.exe"
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  Instalar-Tecnia-Bot.exe" | Set-Content "installer\dist\SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256: $h"

      - name: Subir el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalar-Tecnia-Bot
          path: |
            installer/dist/Instalar-Tecnia-Bot.exe
            installer/dist/SHA256SUMS.txt
          if-no-files-found: error

      # `gh api .../releases/tags/vX.Y.Z --jq '.body'` daba 0 caracteres en TODOS
      # los releases publicados (0.4.1, 0.4.0, 0.3.79 verificados), porque el
      # paso de abajo no le pasaba body ni body_path. Y el sitio publico
      # (tecnialab-web) lee justo esas notas de la API de GitHub para la pagina
      # de versiones — asi que el docente veia notas vacias, mientras el
      # CHANGELOG nunca salia de este repo. `notas-release.mjs` corta con exit 1
      # si la version de VERSION no tiene seccion en CHANGELOG.md: falla el job,
      # no publica sin cuerpo. Node ya viene instalado en windows-latest, igual
      # que en ubuntu-latest (ver ci.yml), asi que no hace falta setup-node.
      - name: Extraer las notas de esta version del CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: node scripts/notas-release.mjs --salida installer\dist\notas-release.md

      - name: Adjuntar al release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: installer/dist/notas-release.md
          files: |
            installer/dist/Instalar-Tecnia-Bot.exe
            installer/dist/SHA256SUMS.txt
