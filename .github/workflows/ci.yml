name: CI

# Corre en cada push y PR a main. Tres jobs, en paralelo:
#   - test (Linux):  typecheck de las tools + smoke tests con Node puro.
#   - windows:       lo que la escuela ejecuta DE VERDAD. Parsea cada .ps1 con el
#                    Windows PowerShell 5.1 real, corre bootstrap.ps1 de punta a
#                    punta en un Windows limpio, compila un sketch con el PlatformIO
#                    que el bootstrap instalo, y desinstala.
#   - skills:        parsea el frontmatter YAML de cada opencode/skills/*/SKILL.md, y
#                    chequea que los proyectos riesgosos de proyectos-inet traigan su
#                    bloque de seguridad.
#
# POR QUE EL JOB DE WINDOWS. 243 tests de Node pasaban en verde y el PowerShell 5.1
# de una VM encontro dos errores de parseo ("$var: texto") que ninguno podia ver:
# los tests miraban los .ps1 como texto, nunca los ejecutaban. Un instalador que
# solo se prueba en Linux no esta probado. tests/ci.test.mjs cuida que estos pasos
# no se saquen sin querer.
#
# POR QUE EL JOB DE SKILLS. Auditoria v0.4.1: educabot/SKILL.md y librerias/SKILL.md
# tenian una description sin comillas con "algo: algo" adentro, que YAML lee como
# clave/valor y no como texto ("mapping values are not allowed here"). Un runtime
# con parser YAML estandar puede no registrar esa skill - la mejor sustentada de
# las dos, la de educabot citando paginas exactas del manual, quedaba invisible sin
# que nadie lo viera en un diff. Este job la agarra antes de mergear.
#
# POR QUE TAMBIEN CHEQUEA SEGURIDAD DE PROYECTOS. Una auditoria encontro 15
# proyectos de proyectos-inet con partes moviles, calor o red electrica y CERO
# advertencia de seguridad fisica. Se arreglaron a mano; arreglarlos no evita que
# el proyecto 16 que alguien escriba con un servo vuelva a salir sin advertencia.
# `scripts/seguridad-proyectos.mjs` corta el PR si eso pasa.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      esp32:
        description: "Compilar tambien el env esp32dev (~5 min mas, baja ~300 MB)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + smoke tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm antes que setup-node: setup-node lo necesita para `cache: pnpm`.
      # La version sale de "packageManager" en package.json (la unica fuente).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24+ corre TypeScript nativo (type stripping), que los tests necesitan
          # para importar los tools .ts sin transpilar.
          node-version: "24"
          cache: pnpm
      - name: Instalar dependencias de desarrollo (typescript, tipos de Bun y del plugin)
        run: pnpm install --frozen-lockfile
      # tsc sobre las tools con los tipos REALES del runtime (@types/bun y
      # @opencode-ai/plugin fijado a install/OPENCODE_VERSION). Estuvo roto con 88
      # errores durante meses porque nadie lo corria: ahora corta el PR.
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck
      - name: Correr smoke tests
        run: pnpm test

  windows:
    name: Instalador real (Windows PowerShell 5.1)
    # windows-latest = Windows Server 2025 (actions/runner-images, README "Available
    # Images"). Trae Windows PowerShell 5.1 (viene con el sistema) y pwsh 7.
    runs-on: windows-latest
    # Medido a ojo: Scoop + OpenCode (~60 MB) + Python + PlatformIO + toolchain AVR
    # rondan los 10-15 min. El default de GitHub son 360 min: un colgado costaria
    # seis horas de runner.
    timeout-minutes: 45
    defaults:
      run:
        # powershell = "PowerShell Desktop" en la doc de GitHub (workflow-syntax,
        # jobs.<job_id>.steps[*].shell): es Windows PowerShell 5.1, el que traen las
        # PCs de la escuela. El default en Windows es pwsh (7.x), que es mas permisivo
        # y NO reproduce lo que ve un docente. Ningun paso de este job usa pwsh.
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # El parser de verdad, en el PowerShell de verdad. Es lo que hubiera cazado
      # los dos "$var: texto" de update.ps1 antes de publicarlos. Se imprime cada
      # error con archivo, linea y mensaje, y se corta si hay uno solo.
      - name: Parsear cada .ps1 con el parser de Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Host "::error::Este paso tiene que correr en Windows PowerShell 5.1 y corrio en $($PSVersionTable.PSVersion)"
            exit 1
          }
          $archivos = @(Get-ChildItem install\*.ps1) + @(Get-ChildItem installer\*.ps1)
          if ($archivos.Count -lt 5) { Write-Host "::error::Esperaba al menos 5 .ps1 y encontre $($archivos.Count)"; exit 1 }
          $total = 0
          foreach ($f in $archivos) {
            $tokens = $null
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errores) | Out-Null
            $rel = $f.FullName.Substring($PWD.Path.Length + 1).Replace('\', '/')
            if ($errores.Count -eq 0) { Write-Host "  OK   $rel"; continue }
            $total += $errores.Count
            foreach ($e in $errores) {
              Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$($e.Message)"
            }
          }
          if ($total -gt 0) { Write-Host "::error::$total error(es) de parseo en Windows PowerShell 5.1"; exit 1 }

      # Linter, solo severidad Error. La imagen windows-2025 trae PSScriptAnalyzer
      # 1.25 (runner-images, Windows2025-Readme.md) instalado desde Windows PowerShell
      # con -Scope AllUsers (scripts/build/Install-PowerShellModules.ps1), asi que 5.1
      # lo ve. Si algun dia lo sacan, se intenta instalar; si eso falla, se avisa y se
      # sigue: el que decide si un .ps1 parsea es el paso anterior, no este.
      - name: PSScriptAnalyzer (solo Severity Error)
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            try {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
            } catch {
              Write-Host "::warning::PSScriptAnalyzer no esta en la imagen y no se pudo instalar ($($_.Exception.Message)). Se saltea el linter."
              exit 0
            }
          }
          Import-Module PSScriptAnalyzer
          $hallazgos = @(Invoke-ScriptAnalyzer -Path install -Severity Error)
          foreach ($h in $hallazgos) {
            Write-Host "::error file=install/$($h.ScriptName),line=$($h.Line)::[$($h.RuleName)] $($h.Message)"
          }
          if ($hallazgos.Count -gt 0) { exit 1 }
          Write-Host "  OK   PSScriptAnalyzer sin hallazgos de severidad Error en install\"

      # COMPILAR EL .iss DE VERDAD, y antes del bootstrap para que falle barato.
      #
      # Esto existe porque la auditoria v0.4.1 dejo commiteado un .iss que NO
      # COMPILABA, con sintaxis "valida", begin/end balanceados 10/10 y los tests
      # que leen el archivo en verde. Dos errores, los dos de la misma familia:
      # un renglon que empezaba con "#13#10" (ISPP lo lee como directiva) y otro
      # que empezaba con "[UninstallDelete]" ADENTRO de un comentario Pascal (el
      # lexer de secciones no mira si esta comentado). Ninguna capa de chequeo
      # estatico puede ver eso. Solo ISCC.
      #
      # No se publica el .exe que sale de aca: build-installer.yml sigue siendo el
      # que empaqueta y firma. Este paso solo responde "construye, si o no".
      - name: Compilar el instalador con ISCC (solo construye, no publica)
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Write-Host "  Compilando installer\tecnia-bot.iss para la version $version"
          # Inno Setup viene preinstalado en los runners windows de GitHub; si algun
          # dia deja de venir, se instala con choco y este paso lo dice en vez de
          # pasar de largo en verde.
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Host "::error::no encontre ISCC.exe ni pude instalarlo"; exit 1 }
          $salida = & $iscc "/DMyAppVersion=$version" "installer\tecnia-bot.iss" 2>&1
          if ($LASTEXITCODE -ne 0) {
            # Las lineas de Error de ISCC traen archivo y numero de linea: se emiten
            # como annotation para que se vean en el PR, no enterradas en el log.
            $salida | Where-Object { $_ -match "^Error" } | ForEach-Object {
              Write-Host "::error file=installer/tecnia-bot.iss::$_"
            }
            $salida | Select-Object -Last 15 | ForEach-Object { Write-Host $_ }
            Write-Host "::error::ISCC no pudo compilar el instalador (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "  OK   el instalador compila"

      # Solo la cache de DESCARGAS de PlatformIO (lo que recomienda su doc de CI:
      # docs.platformio.org/en/latest/integration/ci/github-actions.html), NO
      # ~/.platformio entero: si se restaurara penv\Scripts\pio.exe, el bootstrap
      # diria "PlatformIO ya esta instalado" y ese paso quedaria sin probar.
      - name: Cache de descargas de PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('ejemplos/_test-librerias/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      # El instalador entero, como lo corre el .exe: powershell.exe 5.1 por ruta,
      # -NoProfile -ExecutionPolicy Bypass -File. TECNIA_SIN_PROMPT hace que
      # install.ps1 no pregunte la key de Google (60 s de espera en una consola sin
      # nadie) y siga con el modelo gratuito, que es lo que se verifica despues.
      #
      # UN reintento, del paso entero. bootstrap.ps1 es idempotente (lo que quedo
      # instalado se detecta y no se repite), asi que volver a correrlo es lo mismo
      # que hace un docente al que se le corto la red: "Reparar Tecnia Bot". Los
      # scripts del producto NO llevan reintentos a ciegas; el reintento vive aca,
      # donde la variable que no controlamos es la red del runner.
      - name: bootstrap.ps1 de punta a punta (Scoop + OpenCode + PlatformIO + capa)
        env:
          TECNIA_SIN_PROMPT: "1"
        run: |
          $ps51 = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $codigo = 1
          foreach ($intento in 1, 2) {
            Write-Host "=== bootstrap.ps1, intento $intento de 2 ==="
            & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\bootstrap.ps1
            $codigo = $LASTEXITCODE
            if ($codigo -eq 0) { break }
            Write-Host "::warning::bootstrap.ps1 termino con codigo $codigo en el intento $intento"
          }
          if ($codigo -ne 0) { exit $codigo }

      # Lo que el bootstrap PROMETE, verificado desde afuera, en el disco:
      #   1. OpenCode arranca y es la version de install\OPENCODE_VERSION.
      #   2. Scoop lo tiene fijado ("hold": true), para que un update no lo mueva.
      #   3. opencode.json tiene el agente por defecto y el modelo gratuito.
      #   4. El pio.exe que instalo el bootstrap arranca.
      #   5. instalacion.log tiene la salida de install.ps1 (el transcript se pasa
      #      de mano al hijo; en una notebook real el log se salteaba esa mitad).
      - name: Verificar lo que dejo el bootstrap
        run: |
          $ErrorActionPreference = "Stop"
          $fallas = @()
          $ver = (Get-Content install\OPENCODE_VERSION -Raw).Trim()

          $shim = Join-Path $env:USERPROFILE "scoop\shims\opencode.exe"
          if (-not (Test-Path $shim)) { $fallas += "no existe $shim" }
          else {
            $salida = (& $shim --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { $fallas += "opencode --version devolvio $LASTEXITCODE" }
            elseif ($salida -notmatch ('(^|[^\d.])' + [regex]::Escape($ver) + '([^\d.]|$)')) { $fallas += "opencode --version dice '$salida' y install\OPENCODE_VERSION dice $ver" }
            else { Write-Host "  OK   opencode --version -> $salida" }
          }

          # Scoop 0.6.0 lo llama scoop-install.json; antes, install.json (issue #42).
          $ocCurrent = Join-Path $env:USERPROFILE "scoop\apps\opencode\current"
          $installJson = @("scoop-install.json", "install.json") | ForEach-Object { Join-Path $ocCurrent $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installJson) { $fallas += "no existe scoop-install.json ni install.json en $ocCurrent" }
          else {
            Write-Host "  OK   $(Split-Path -Leaf $installJson) de Scoop"
            $ij = Get-Content $installJson -Raw | ConvertFrom-Json
            if ($ij.hold -ne $true) { $fallas += "$(Split-Path -Leaf $installJson) no tiene ""hold"": true (scoop hold no quedo)" }
            else { Write-Host "  OK   scoop hold opencode" }
          }

          $ocJson = Join-Path $env:USERPROFILE ".config\opencode\opencode.json"
          if (-not (Test-Path $ocJson)) { $fallas += "no existe $ocJson" }
          else {
            $oc = Get-Content $ocJson -Raw | ConvertFrom-Json
            if ($oc.default_agent -ne "tecnia-bot") { $fallas += "default_agent es '$($oc.default_agent)', no 'tecnia-bot'" }
            $modelo = $null
            if ($oc.agent -and ($oc.agent.PSObject.Properties.Name -contains "tecnia-bot")) { $modelo = $oc.agent."tecnia-bot".model }
            if ($modelo -ne "opencode/big-pickle") { $fallas += "agent.tecnia-bot.model es '$modelo', no 'opencode/big-pickle'" }
            else { Write-Host "  OK   opencode.json: default_agent tecnia-bot, modelo $modelo" }
          }
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".config\opencode\agent\tecnia-bot.md"))) { $fallas += "falta .config\opencode\agent\tecnia-bot.md" }
          # La carpeta del vinculo con Tecnia Lab: tool\cuenta.ts la importa con ..\plataforma\. Es el unico
          # lugar donde se mira en el disco real que el instalador la copio; los tests solo leen las listas.
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".config\opencode\plataforma\cuenta.ts"))) { $fallas += "falta .config\opencode\plataforma\cuenta.ts" }
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".config\opencode\tool\cuenta.ts"))) { $fallas += "falta .config\opencode\tool\cuenta.ts" }

          $pio = Join-Path $env:USERPROFILE ".platformio\penv\Scripts\pio.exe"
          if (-not (Test-Path $pio)) { $fallas += "no existe $pio" }
          else {
            $v = (& $pio --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { $fallas += "pio --version devolvio $LASTEXITCODE" }
            else { Write-Host "  OK   $v" }
          }

          # bootstrap.ps1 deja el log en la raiz del repo ($RepoDir), que aca es el checkout.
          $log = Join-Path $PWD "instalacion.log"
          if (-not (Test-Path $log)) { $fallas += "no existe $log" }
          elseif (-not (Select-String -LiteralPath $log -SimpleMatch "==> Instalando Tecnia Bot en:" -Quiet)) { $fallas += "instalacion.log no tiene la salida de install.ps1 (falta '==> Instalando Tecnia Bot en:')" }
          else { Write-Host "  OK   instalacion.log tiene la salida de install.ps1" }

          if ($fallas.Count -gt 0) {
            $fallas | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      # Con el pio del bootstrap (por ruta, no por PATH: PlatformIO no se agrega al
      # PATH de esta consola). El env uno tarda ~2 min; esp32dev queda a pedido.
      - name: Compilar ejemplos/_test-librerias para Arduino UNO
        run: |
          $pio = Join-Path $env:USERPROFILE ".platformio\penv\Scripts\pio.exe"
          & $pio run -d ejemplos\_test-librerias -e uno
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar tambien para ESP32 (solo a pedido, Run workflow -> esp32)
        if: inputs.esp32
        run: |
          $pio = Join-Path $env:USERPROFILE ".platformio\penv\Scripts\pio.exe"
          & $pio run -d ejemplos\_test-librerias -e esp32dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # USUARIO CON TILDE. Medido en la VM win10 el 2026-11-15 con el install.ps1
      # publicado en la 0.4.8: con la config en una carpeta "Direccion310" con tilde,
      # "instructions" de opencode.json pasaba de 2 entradas a 4 y a 6 en tres
      # corridas, porque el script releia su propio UTF-8 como ANSI. Aca se corre DOS
      # veces y se cuenta. La "o" con tilde se arma con [char]0xF3 para no depender de
      # la codepage con la que el runner lea este archivo.
      - name: install.ps1 dos veces con la config en una carpeta con tilde no duplica instructions
        run: |
          $ErrorActionPreference = "Stop"
          $ps51 = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $base = Join-Path $env:RUNNER_TEMP ("Direcci" + [string][char]0xF3 + "n310")
          New-Item -ItemType Directory -Force -Path (Join-Path $base "config"), (Join-Path $base "data") | Out-Null
          $env:XDG_CONFIG_HOME = Join-Path $base "config"
          $env:XDG_DATA_HOME = Join-Path $base "data"
          $env:TECNIA_SIN_PROMPT = "1"
          $oc = Join-Path $base "config\opencode\opencode.json"
          foreach ($vuelta in 1, 2) {
            & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\install.ps1
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::install.ps1 (vuelta $vuelta) devolvio $LASTEXITCODE"; exit 1 }
            if (-not (Test-Path $oc)) { Write-Host "::error::no quedo $oc"; exit 1 }
            $j = [System.IO.File]::ReadAllText($oc, (New-Object System.Text.UTF8Encoding $false)) | ConvertFrom-Json
            $ins = @($j.instructions | Where-Object { $_ })
            Write-Host "  vuelta ${vuelta}: instructions = $($ins.Count)"
            if ($ins.Count -ne 2) { Write-Host "::error::instructions tiene $($ins.Count) entradas en la vuelta $vuelta (tienen que ser 2)"; exit 1 }
            foreach ($r in $ins) { if (-not (Test-Path -LiteralPath $r)) { Write-Host "::error::instructions apunta a un archivo que no existe: $r"; exit 1 } }
          }
          Write-Host "  OK   la config en una carpeta con tilde no se duplica"

      # EL DESINSTALADOR Y LOS DATOS PERSONALES. Hasta la 0.4.8, "-Borrar" sin manifest
      # salia con 0 sin borrar nada, y con opencode.json de solo lectura moria antes de
      # llegar a los datos (medido en la VM). Se corre en la misma carpeta con tilde,
      # sin tocar el perfil real del runner. Contrato de uninstall.ps1 (su encabezado):
      # 0 = todo borrado, 3 = parcial. La "key" es un texto cualquiera: no es una key.
      - name: uninstall.ps1 borra los datos personales cuando se pide, aun sin manifest, y los conserva cuando no
        run: |
          $ErrorActionPreference = "Stop"
          $ps51 = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $base = Join-Path $env:RUNNER_TEMP ("Direcci" + [string][char]0xF3 + "n310")
          $env:XDG_CONFIG_HOME = Join-Path $base "config"
          $env:XDG_DATA_HOME = Join-Path $base "data"
          $env:TECNIA_SIN_PROMPT = "1"
          $cfg = Join-Path $base "config\opencode"
          $auth = Join-Path $base "data\opencode\auth.json"
          $sinBom = New-Object System.Text.UTF8Encoding $false
          function Sembrar {
            New-Item -ItemType Directory -Force -Path (Split-Path $auth -Parent) | Out-Null
            [System.IO.File]::WriteAllText($auth, '{"google":{"type":"api","key":"TEXTO-DE-PRUEBA-NO-ES-UNA-KEY"},"otro":{"type":"api","key":"x"}}', $sinBom)
            & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\install.ps1
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::install.ps1 (sembrar) devolvio $LASTEXITCODE"; exit 1 }
            foreach ($f in "tecnia-perfil.md", "tecnia-memoria.md", "tecnia-bot.manifest") { if (-not (Test-Path (Join-Path $cfg $f))) { Write-Host "::error::la siembra no dejo $f"; exit 1 } }
          }
          function Estado {
            $a = [System.IO.File]::ReadAllText($auth, $sinBom) | ConvertFrom-Json
            return @{ perfil = (Test-Path (Join-Path $cfg "tecnia-perfil.md")); memoria = (Test-Path (Join-Path $cfg "tecnia-memoria.md")); google = ($null -ne $a.google); otro = ($null -ne $a.otro) }
          }
          function Exigir($que, $cond) { if (-not $cond) { Write-Host "::error::$que"; exit 1 }; Write-Host "  OK   $que" }

          Write-Host "== -Borrar, camino normal"
          Sembrar
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\uninstall.ps1 -Borrar
          $rc = $LASTEXITCODE; $e = Estado
          Exigir "borrar: sale con 0 (salio $rc)" ($rc -eq 0)
          Exigir "borrar: el perfil y la memoria ya no estan" ((-not $e.perfil) -and (-not $e.memoria))
          Exigir "borrar: la key de Google salio de auth.json y la otra credencial sigue" ((-not $e.google) -and $e.otro)

          Write-Host "== -Borrar SIN manifest"
          Sembrar
          Remove-Item (Join-Path $cfg "tecnia-bot.manifest") -Force
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\uninstall.ps1 -Borrar
          $rc = $LASTEXITCODE; $e = Estado
          Exigir "sin manifest: sale con 3, parcial (salio $rc)" ($rc -eq 3)
          Exigir "sin manifest: el perfil y la memoria se borraron igual" ((-not $e.perfil) -and (-not $e.memoria))
          Exigir "sin manifest: la key de Google salio igual" (-not $e.google)

          Write-Host "== -Conservar"
          Sembrar
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\uninstall.ps1 -Conservar
          $rc = $LASTEXITCODE; $e = Estado
          Exigir "conservar: sale con 0 (salio $rc)" ($rc -eq 0)
          Exigir "conservar: el perfil y la memoria SIGUEN" ($e.perfil -and $e.memoria)
          Exigir "conservar: la key de Google SIGUE" ($e.google -and $e.otro)
          Exigir "conservar: el agente si se desinstalo" (-not (Test-Path (Join-Path $cfg "agent\tecnia-bot.md")))

      # -Conservar: no pregunta por los datos personales (los deja). Despues no
      # tiene que quedar rastro nuestro en opencode.json ni el agente instalado.
      - name: uninstall.ps1 -Conservar deja opencode.json sin rastro de tecnia-bot
        run: |
          $ErrorActionPreference = "Stop"
          $ps51 = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          & $ps51 -NoProfile -ExecutionPolicy Bypass -File install\uninstall.ps1 -Conservar
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::uninstall.ps1 devolvio $LASTEXITCODE"; exit 1 }
          $ocJson = Join-Path $env:USERPROFILE ".config\opencode\opencode.json"
          if (Test-Path $ocJson) {
            $oc = Get-Content $ocJson -Raw | ConvertFrom-Json
            if ($oc.default_agent -eq "tecnia-bot") { Write-Host "::error::default_agent sigue siendo tecnia-bot"; exit 1 }
            if ($oc.agent -and ($oc.agent.PSObject.Properties.Name -contains "tecnia-bot")) { Write-Host "::error::agent.tecnia-bot sigue en opencode.json"; exit 1 }
            Write-Host "  OK   opencode.json quedo sin tecnia-bot"
          } else {
            # uninstall.ps1 borra el archivo si solo quedaba nuestro $schema: tambien vale.
            Write-Host "  OK   opencode.json se borro (solo tenia lo nuestro)"
          }
          if (Test-Path (Join-Path $env:USERPROFILE ".config\opencode\agent\tecnia-bot.md")) { Write-Host "::error::agent\tecnia-bot.md sigue instalado"; exit 1 }
          if (Test-Path (Join-Path $env:USERPROFILE ".config\opencode\plataforma\cuenta.ts")) { Write-Host "::error::plataforma\cuenta.ts sigue instalado"; exit 1 }

      # El transcript del bootstrap (Start-Transcript, al lado del repo). Si algo
      # fallo, es lo primero que hay que leer; se sube siempre, no solo en fallo.
      - name: Guardar instalacion.log (transcript del bootstrap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalacion-log
          path: |
            instalacion.log
            instalacion-*.log
          if-no-files-found: ignore

  # LINUX DE VERDAD. Los tests de Node ejecutan los .sh, pero con la red cortada y
  # sin bajar OpenCode ni PlatformIO. Este job hace lo que hace un docente: corre
  # bootstrap.sh en una maquina limpia, con Internet, y despues mira el disco.
  # Hasta la auditoria del 2026-11-15 bootstrap.sh no se habia ejecutado en ningun
  # test ni en ningun CI. Codigos de bootstrap.sh (su encabezado): 0 todo
  # comprobado, 3 la capa quedo pero falta una dependencia.
  linux-real:
    name: Instalador real (Linux, bootstrap.sh de punta a punta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: bootstrap.sh de punta a punta (OpenCode + PlatformIO + capa)
        env:
          TECNIA_SIN_PROMPT: "1"
        run: |
          set -u
          rc=0
          bash install/bootstrap.sh || rc=$?
          echo "bootstrap.sh salio con $rc"
          if [ "$rc" -ne 0 ]; then echo "::error::bootstrap.sh devolvio $rc (se esperaba 0)"; exit 1; fi

      - name: Verificar en el disco lo que dejo bootstrap.sh
        run: |
          set -u
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          falla() { echo "::error::$1"; exit 1; }
          v="$(opencode --version 2>&1)" || falla "opencode --version no contesta: $v"
          echo "  OK   opencode --version = $v"
          esperada="$(tr -d '[:space:]' < install/OPENCODE_VERSION)"
          [ "$v" = "$esperada" ] || falla "OpenCode es $v y install/OPENCODE_VERSION dice $esperada"
          pio="$HOME/.platformio/penv/bin/pio"
          [ -x "$pio" ] || falla "no esta $pio"
          pv="$("$pio" --version 2>&1)" || falla "pio --version no contesta: $pv"
          echo "  OK   $pv"
          cfg="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          [ -f "$cfg/agent/tecnia-bot.md" ] || falla "falta el agente en $cfg/agent"
          [ -f "$cfg/plataforma/cuenta.ts" ] || falla "falta la carpeta del vinculo con Tecnia Lab en $cfg/plataforma"
          [ -f "$cfg/tool/cuenta.ts" ] || falla "falta el tool cuenta en $cfg/tool"
          [ -f "$cfg/tecnia-bot.manifest" ] || falla "falta el manifest en $cfg"
          agente="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("default_agent",""))' "$cfg/opencode.json")" || falla "opencode.json no parsea"
          [ "$agente" = "tecnia-bot" ] || falla "default_agent es [$agente], no tecnia-bot"
          echo "  OK   la capa esta publicada y Tecnia Bot es el agente por defecto"

      # LA FALLA REAL: sin curl ni wget no se puede bajar OpenCode ni PlatformIO.
      # Hasta la 0.4.8, con `set -e` el script moria ahi SIN instalar la capa, contra
      # su propio comentario. Se arma un PATH con todo lo del sistema menos esos dos
      # (no se simula ningun resultado: los programas de verdad no estan) y un HOME
      # nuevo. Tiene que salir con 3 y dejar la capa.
      - name: bootstrap.sh sin curl ni wget instala la capa igual y sale con 3
        env:
          TECNIA_SIN_PROMPT: "1"
        run: |
          set -u
          bin="$RUNNER_TEMP/bin-sin-descargador"; mkdir -p "$bin"
          for d in /usr/local/bin /usr/bin /bin; do
            for f in "$d"/*; do
              n="$(basename "$f")"
              case "$n" in curl|wget|opencode|pio|platformio) continue ;; esac
              # -L ademas de -e: en el runner hay enlaces rotos en /usr/bin (por ejemplo
              # grub-ntldr-img). Para `-e` un enlace roto "no existe", asi que al
              # encontrarlo de nuevo en /bin se intentaba crear otra vez y `ln` cortaba
              # el paso con "Already exists". Fue lo unico rojo de la primera corrida.
              if [ ! -e "$bin/$n" ] && [ ! -L "$bin/$n" ]; then ln -s "$f" "$bin/$n"; fi
            done
          done
          if PATH="$bin" command -v curl >/dev/null 2>&1; then echo "::error::la precondicion no se cumple: sigue habiendo curl"; exit 1; fi
          casa="$RUNNER_TEMP/casa-sin-red"; mkdir -p "$casa"
          rc=0
          HOME="$casa" XDG_CONFIG_HOME= XDG_DATA_HOME= PATH="$bin" bash install/bootstrap.sh || rc=$?
          echo "bootstrap.sh salio con $rc"
          if [ "$rc" -ne 3 ]; then echo "::error::bootstrap.sh sin descargador devolvio $rc (se esperaba 3: capa instalada, faltan dependencias)"; exit 1; fi
          if [ ! -f "$casa/.config/opencode/agent/tecnia-bot.md" ]; then echo "::error::sin descargador la capa NO quedo instalada"; exit 1; fi
          echo "  OK   sin curl ni wget la capa quedo instalada y el codigo es 3"

      - name: uninstall.sh --conservar saca la capa
        run: |
          set -u
          rc=0
          bash install/uninstall.sh --conservar || rc=$?
          if [ "$rc" -ne 0 ]; then echo "::error::uninstall.sh devolvio $rc"; exit 1; fi
          cfg="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          if [ -f "$cfg/agent/tecnia-bot.md" ]; then echo "::error::el agente sigue instalado"; exit 1; fi
          if [ -e "$cfg/plataforma" ]; then echo "::error::la carpeta plataforma sigue instalada"; exit 1; fi
          if [ ! -f "$cfg/tecnia-perfil.md" ]; then echo "::error::--conservar borro el perfil"; exit 1; fi
          echo "  OK   la capa salio y el perfil se conservo"

  # MACOS, POR PRIMERA VEZ. El README anuncio macOS durante meses y nunca hubo una
  # sola ejecucion en una Mac: ni runner, ni bitacora. Este job es la primera
  # evidencia. Se corre con el /bin/bash del sistema (3.2), que es el que tiene una
  # Mac recien sacada de la caja. Si se pone rojo, eso ES informacion: no se le pone
  # continue-on-error.
  macos:
    name: Instalador real (macOS, bash 3.2 del sistema)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Que maquina es (lo que despues hay que citar como evidencia)
        run: |
          sw_vers
          uname -m
          /bin/bash --version | head -1
          command -v python3 && python3 --version
          xcode-select -p || echo "xcode-select -p fallo: no hay Command Line Tools"
          command -v jq || echo "no hay jq"
          command -v curl

      - name: install.sh con el bash 3.2 del sistema (solo la capa)
        env:
          TECNIA_SIN_PROMPT: "1"
        run: |
          set -u
          rc=0
          /bin/bash install/install.sh || rc=$?
          echo "install.sh salio con $rc"
          if [ "$rc" -ne 0 ]; then echo "::error::install.sh devolvio $rc en macOS (se esperaba 0)"; exit 1; fi
          cfg="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          [ -f "$cfg/agent/tecnia-bot.md" ] || { echo "::error::falta el agente en $cfg/agent"; exit 1; }
          [ -f "$cfg/plataforma/cuenta.ts" ] || { echo "::error::falta la carpeta del vinculo con Tecnia Lab en $cfg/plataforma"; exit 1; }
          agente="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("default_agent",""))' "$cfg/opencode.json")" || { echo "::error::opencode.json no parsea"; exit 1; }
          [ "$agente" = "tecnia-bot" ] || { echo "::error::default_agent es [$agente]"; exit 1; }
          modo="$(stat -f %Lp "$cfg/tecnia-perfil.md")"
          [ "$modo" = "600" ] || { echo "::error::tecnia-perfil.md nacio con modo $modo (tiene que ser 600)"; exit 1; }
          echo "  OK   la capa quedo instalada en macOS, con el perfil en 600"

      - name: bootstrap.sh de punta a punta en macOS (OpenCode + PlatformIO + capa)
        env:
          TECNIA_SIN_PROMPT: "1"
        run: |
          set -u
          rc=0
          /bin/bash install/bootstrap.sh || rc=$?
          echo "bootstrap.sh salio con $rc"
          if [ "$rc" -ne 0 ]; then echo "::error::bootstrap.sh devolvio $rc en macOS (se esperaba 0)"; exit 1; fi
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          v="$(opencode --version 2>&1)" || { echo "::error::opencode --version no contesta: $v"; exit 1; }
          echo "  OK   opencode --version = $v"
          pv="$("$HOME/.platformio/penv/bin/pio" --version 2>&1)" || { echo "::error::pio --version no contesta: $pv"; exit 1; }
          echo "  OK   $pv"

      - name: uninstall.sh --conservar saca la capa en macOS
        run: |
          set -u
          rc=0
          /bin/bash install/uninstall.sh --conservar || rc=$?
          if [ "$rc" -ne 0 ]; then echo "::error::uninstall.sh devolvio $rc"; exit 1; fi
          cfg="${XDG_CONFIG_HOME:-$HOME/.config}/opencode"
          if [ -f "$cfg/agent/tecnia-bot.md" ]; then echo "::error::el agente sigue instalado"; exit 1; fi
          if [ -e "$cfg/plataforma" ]; then echo "::error::la carpeta plataforma sigue instalada"; exit 1; fi
          if [ ! -f "$cfg/tecnia-perfil.md" ]; then echo "::error::--conservar borro el perfil"; exit 1; fi
          echo "  OK   la capa salio y el perfil se conservo"

  skills:
    name: Frontmatter de las skills (YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python en vez del python3 del sistema: Ubuntu 24.04 marca su python
      # de apt como "externally managed" (PEP 668) y pip install ahi falla sin
      # --break-system-packages. El python de setup-python no tiene esa traba.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # SIN `cache: pip`, y no es un olvido: setup-python arma la clave del cache
      # a partir de un requirements.txt o un pyproject.toml, y si no encuentra
      # ninguno FALLA EL PASO ("No file matched to [**/requirements.txt or
      # **/pyproject.toml]"). Aca no hay ninguno de los dos a proposito -es una
      # sola dependencia, PyYAML- asi que pedir cache tiraba abajo el job entero
      # antes de validar una sola skill. Se descubrio en el primer runner real:
      # localmente el YAML parsea igual, el error solo existe en Actions.
      #
      # PyYAML puro, sin requirements.txt: es el mismo parser que rompio con las
      # dos description sin comillas de la auditoria v0.4.1, y se instala en
      # segundos (wheel precompilado, sin toolchain), asi que el cache tampoco
      # ahorraba nada que valga la pena.
      - name: Instalar PyYAML
        run: pip install --quiet pyyaml
      # La logica vive en scripts/validar-skills.py, NO inline aca, y no es prolijidad:
      # mientras vivio en este archivo solo corria en el runner, y el 2026-09-25 `pnpm
      # test` dio 607 tests en verde con un skill inservible. Era ademas el unico de los
      # tres chequeos fuera del patron -- fichas y seguridad ya tenian su script corrible
      # local. El porque de PyYAML (y por que NO pasarlo a js-yaml) esta en el script.
      - name: Validar frontmatter de opencode/skills/*/SKILL.md
        run: python3 scripts/validar-skills.py
      # Node puro, sin dependencias: no hace falta setup-node porque ubuntu-latest
      # ya trae Node instalado (lo usan las propias actions de JS de este workflow).
      - name: Chequear bloque de seguridad en proyectos-inet
        run: node scripts/seguridad-proyectos.mjs
