; ============================================================================
;  PROYECTO INTERNO DE VERIFICACION — NO es un ejemplo didactico
; ============================================================================
;  Objetivo: comprobar que TODOS los lib_deps del ecosistema Tecnia Bot
;  resuelven y COMPILAN, tanto en Arduino UNO (AVR) como en ESP32.
;
;  Se compila con:   pio run                (ambos environments)
;                    pio run -e uno         (solo UNO)
;                    pio run -e esp32dev     (solo ESP32)
;
;  El codigo de src/main.cpp es COMPILE-ONLY: incluye cada header y crea
;  cada objeto una vez. No corre en hardware real.
;
;  Referencia humana: ../../docs/librerias.md
;  Nombres de paquete tomados del registro oficial: https://registry.platformio.org
; ============================================================================

; ----------------------------------------------------------------------------
;  [env]  -> valores comunes heredados por TODOS los environments de abajo.
;  Aca van las librerias PORTABLES que compilan igual en AVR y en ESP32.
; ----------------------------------------------------------------------------
[env]
framework = arduino
build_flags = -w                       ; silencia warnings de las libs (compile-only)
lib_deps =
    adafruit/DHT sensor library         ; sensor de temperatura/humedad DHT11 / DHT22
    adafruit/Adafruit Unified Sensor    ; base de sensores (dependencia de varias Adafruit)
    adafruit/Adafruit BMP085 Library    ; presion barometrica BMP085 / BMP180
    chris--a/Keypad                     ; teclado matricial 4x4  (ojo: owner = chris--a, con doble guion)
    adafruit/Adafruit GFX Library       ; primitivas graficas (base de displays)
    adafruit/Adafruit BusIO             ; abstraccion I2C/SPI (dependencia de SSD1306 y MPU6050)
    adafruit/Adafruit SSD1306           ; display OLED 128x64 (arrastra GFX + BusIO)
    adafruit/Adafruit NeoPixel          ; tira de LEDs WS2812 direccionables
    adafruit/Adafruit MPU6050           ; acelerometro + giroscopio (arrastra Unified Sensor + BusIO)
    arduino-libraries/Stepper           ; motor paso a paso — NO viene bundled con NINGUN framework
    arduino-libraries/LiquidCrystal     ; LCD paralelo 16x2 (HD44780) — NO viene bundled con NINGUN framework
    marcoschwartz/LiquidCrystal_I2C     ; LCD 16x2 por modulo I2C (usado en ESP32 de varios proyectos)

; ----------------------------------------------------------------------------
;  Arduino UNO (y Nano) — plataforma AVR
;  Nucleo/bundled en AVR: EEPROM, SPI, Wire, SoftwareSerial, HID (NO llevan lib_deps)
;  Servo NO viene bundled en AVR -> se agrega el paquete oficial.
; ----------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
monitor_speed = 9600
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Servo             ; Servo en AVR — sin esto: "Servo.h: No such file"

; ----------------------------------------------------------------------------
;  ESP32-DevKitC (WROOM-32) — plataforma espressif32
;  Nucleo/bundled en ESP32: EEPROM, SPI, Wire, WiFi (+ muchas mas) (NO llevan lib_deps)
;  En ESP32 la libreria Servo se llama distinto: ESP32Servo.
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo            ; Servo en ESP32 — reemplaza a arduino-libraries/Servo
