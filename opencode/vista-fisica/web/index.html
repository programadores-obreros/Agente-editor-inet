<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tecnia Bot — vista física</title>
<!--
  Bundle Wokwi Elements — DEFECTO detectado por el orquestador (P2-T6, cierre):
  esta página nunca cargó este script, así que <wokwi-esp32-devkit-v1>/<wokwi-led>
  (creados dinámicamente por pintar.js) quedaban como "custom elements indefinidos"
  (HTMLElement genérico, sin tamaño real) — se veía la página, pero no el circuito.

  Mismo mecanismo que ya usa opencode/tool/circuito.ts (construirHTML, scriptSrc en
  <head>): un <script> CLÁSICO (no `type="module"`) en <head>, que bloquea el
  parseo hasta ejecutarse — así customElements.define() ya corrió ANTES de que
  app.js (`type="module"`, diferido por spec) llegue a crear cualquier elemento vía
  pintar.js. Mismo origen ('self'), servido por la lista blanca de
  servidor-proyecto.ts — la CSP (`script-src 'self'`) ya lo permite sin cambios,
  nunca inline. Verificado por tests/phase2-transporte-http.test.mjs, "GET /
  referencia un asset de la lista blanca que define <wokwi-esp32-devkit-v1>/
  <wokwi-led>".
-->
<script src="/assets/wokwi-bundle.js"></script>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  #revision, #readiness, #conexion { font-size: 13px; padding: 2px 8px; border: 1px solid currentColor; border-radius: 999px; }
  /* Revisión post red-team (B2): el indicador de conexión SIEMPRE está presente en
     el DOM (no aparece/desaparece) — sólo cambia de color/texto vía data-estado-conexion. */
  #conexion[data-estado-conexion="desconectado"] { border-color: #b91c1c; color: #b91c1c; }
  #estado { min-height: 1.4em; margin-bottom: 12px; font-size: 13px; }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 2px 0; font-size: 13px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; }
  select { font-size: 13px; }

  /* Fase 2, Slice 2 (§3.5, HD-S2-5): sólo CSS, sin motor de layout ni tabla de
     tamaños. `#circuito` acomoda placa+componentes con "aire" entre ellos en vez de
     quedar pegados como texto en línea (ARCH-S2-PHYSICAL/INFORME.md §6, opción B). */
  #circuito { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  /* `transform:scale()` es puramente cosmético (wokwi-render-datos.ts::ESCALA_WOKWI_POR_PLACA,
     circuito.ts:93-99 citado ahí) — el elemento escalado NO reserva más espacio de
     layout que su tamaño sin escalar, así que la pieza vecina puede quedar pisada.
     Este margen fijo en la placa (única con escala != 1 hoy, ESP32 a 1.25) compensa
     el desborde real medido en Chromium (ARCH-S2-PHYSICAL/INFORME.md §6: ~106.6px de
     ancho reservado vs. ~133px visual, ~204px de alto reservado vs. ~255px visual) —
     un valor fijo, cosmético, nunca una tabla de tamaños por placa. */
  #circuito [data-entidad-tipo="placa"] { margin-right: 32px; margin-bottom: 56px; }

  /* Fix post-gate (Chromium real, .../s2impl/gate-vista/v2-gpio34-blocking.png):
     una pieza CON rol va envuelta en su propio contenedor (`<figure>`,
     `pintar.js::pintarElemento`) junto con su rótulo — flex-wrap opera sobre ese
     contenedor ENTERO, nunca separa la pieza de su texto. Sólo CSS/DOM mínimo, sin
     motor de layout: se le quita el margen por defecto del navegador y se apila la
     pieza + el rótulo en columna, con el rótulo DEBAJO. */
  #circuito figure[data-pieza-de] { margin: 0; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #circuito figure[data-pieza-de] figcaption { font-size: 12px; }

  /* Fase 2, Slice 2 (§3.4, resaltado C): el elemento del componente afectado por un
     motivo se remarca según la severidad — presentación pura, derivada del atributo
     `data-afectado` que `pintar.js` ya calculó (nunca una decisión nueva acá). */
  [data-afectado="blocking"] { outline: 3px solid #b91c1c; }
  [data-afectado="warning"] { outline: 3px dashed #b45309; }
  [data-afectado="info"] { outline: 2px dotted #1d4ed8; }

  /* W0-8 (PHASE_3_WAVE_0_DESIGN.md): "Este proyecto todavía no tiene componentes..."
     — nunca una superficie vacía sin ningún indicio (`pintar.js::pintarEstadoVacio`). */
  [data-estado-vacio] { font-style: italic; opacity: .8; }
</style>
</head>
<body>
<header>
  <h1>Tecnia Bot — vista física</h1>
  <span id="revision">revisión: —</span>
  <span id="readiness">—</span>
  <span id="conexion" data-estado-conexion="conectado">conectado</span>
</header>
<div id="estado" role="status" aria-live="polite"></div>
<main>
  <section>
    <h2>Circuito</h2>
    <div id="circuito"></div>
  </section>
  <section>
    <h2>Cables</h2>
    <ul id="cables"></ul>
  </section>
  <section>
    <h2>Controles</h2>
    <div id="controles"></div>
  </section>
  <section>
    <h2>Reglas</h2>
    <div id="reglas"></div>
  </section>
  <section>
    <h2>Motivos</h2>
    <ul id="motivos"></ul>
  </section>
</main>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
